name: Apply FatePrice thumbnails on PR 203

on:
  push:
    branches:
      - feat/fateprice-canonical-thumbnails-2026-09-07
    paths:
      - mobile/scripts/apply-fateprice-thumbnails-203.mjs
      - .github/workflows/apply-fateprice-thumbnails-203.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/fateprice-canonical-thumbnails-2026-09-07
          fetch-depth: 0
      - name: Apply guarded FatePrice thumbnail edits
        run: node mobile/scripts/apply-fateprice-thumbnails-203.mjs
      - name: Remove one-shot machinery
        run: rm mobile/scripts/apply-fateprice-thumbnails-203.mjs .github/workflows/apply-fateprice-thumbnails-203.yml
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add canonical thumbnails throughout FatePrice"
          git push origin HEAD:feat/fateprice-canonical-thumbnails-2026-09-07
