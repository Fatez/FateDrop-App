name: Finalize canonical thumbnail pilot

on:
  push:
    branches:
      - feat/fatepulse-canonical-thumbnails-pilot-2026-09-07

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[thumbnail-pilot-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fatepulse-canonical-thumbnails-pilot-2026-09-07
          fetch-depth: 0
      - name: Remove superseded placeholder code
        run: node mobile/scripts/finalize-canonical-thumbnail-pilot.mjs
      - name: Remove one-shot machinery
        run: rm mobile/scripts/finalize-canonical-thumbnail-pilot.mjs .github/workflows/finalize-canonical-thumbnail-pilot.yml
      - name: Commit clean source
        run: |
          git config user.name "FateDrop thumbnail pilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize canonical thumbnail pilot source [thumbnail-pilot-finalized]"
          git push origin HEAD:feat/fatepulse-canonical-thumbnails-pilot-2026-09-07
