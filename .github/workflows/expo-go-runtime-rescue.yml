name: Expo Go Runtime Rescue

on:
  push:
    branches: [agent/expo-go-runtime-rescue]

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
        with:
          ref: agent/expo-go-runtime-rescue

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate mobile lockfile safely
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify mobile
        working-directory: mobile
        run: npm run verify

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor@latest

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "mobile/package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Sync mobile lockfile for Expo Go rescue"
          git push origin HEAD:agent/expo-go-runtime-rescue
