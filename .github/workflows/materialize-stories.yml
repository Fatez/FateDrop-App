name: Materialize FateDrop Stories assets

on:
  push:
    branches:
      - qa/profile-polish-2026-08-25
    paths:
      - '.story-staging/ready.txt'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/profile-polish-2026-08-25
          fetch-depth: 0

      - name: Rebuild and validate Stories archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .story-staging/ready.txt
          test "$(find .story-staging/chunks -type f -name 'chunk-*.txt' | wc -l)" -eq 35
          cat .story-staging/chunks/chunk-*.txt | tr -d '[:space:]' > /tmp/fatedrop-stories-assets.b64
          test "$(wc -c < /tmp/fatedrop-stories-assets.b64)" -eq 620296
          base64 --decode /tmp/fatedrop-stories-assets.b64 > /tmp/fatedrop-stories-assets.tar.gz
          echo "a24abecbec47078336a67686ec9a3d9587291be8f54991c9efb1710e483b24f6  /tmp/fatedrop-stories-assets.tar.gz" | sha256sum --check -
          test "$(stat -c%s /tmp/fatedrop-stories-assets.tar.gz)" -eq 465220

          rm -rf mobile/assets/stories
          tar -xzf /tmp/fatedrop-stories-assets.tar.gz

          python - <<'PY'
          from pathlib import Path

          root = Path('mobile/assets/stories')
          expected = [root / 'intro' / f'frame-{n:02d}.webp' for n in range(1, 5)]
          expected += [root / 'manga' / f'page-{n:02d}.webp' for n in range(1, 11)]
          actual = sorted(p for p in root.rglob('*') if p.is_file())
          assert len(actual) == 14, f'Expected 14 Story assets, found {len(actual)}'
          assert set(actual) == set(expected), f'Unexpected Story asset set: {actual}'
          for path in expected:
              data = path.read_bytes()
              assert len(data) > 1000, f'{path} is unexpectedly small'
              assert data[:4] == b'RIFF', f'{path} missing RIFF header'
              assert data[8:12] == b'WEBP', f'{path} missing WEBP signature'
          print('Validated 4 Gemini intro frames + 10 manga pages.')
          PY

      - name: Commit binary Story assets and remove staging transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .story-staging
          rm -f .github/workflows/materialize-stories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile/assets/stories .story-staging .github/workflows/materialize-stories.yml
          git diff --cached --stat
          git commit -m "Bundle FateDrop Stories assets"
          git push origin HEAD:qa/profile-polish-2026-08-25
