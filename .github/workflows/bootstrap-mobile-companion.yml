name: Bootstrap mobile companion

on:
  push:
    branches:
      - agent/mobile-companion-rescue
    paths:
      - '.github/workflows/bootstrap-mobile-companion.yml'
      - '.asset-staging/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and validate models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/assets/models
          for model in male female droid; do
            cat ".asset-staging/${model}."* | base64 --decode | gzip --decompress > "mobile/assets/models/fatedrop-${model}.glb"
          done
          test "$(stat -c%s mobile/assets/models/fatedrop-male.glb)" -eq 31164
          test "$(stat -c%s mobile/assets/models/fatedrop-female.glb)" -eq 46348
          test "$(stat -c%s mobile/assets/models/fatedrop-droid.glb)" -eq 42680
          for file in mobile/assets/models/*.glb; do
            test "$(xxd -p -l 4 "$file")" = "676c5446"
          done
          rm -rf .asset-staging
      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize mobile Companion assets and lockfile"
          git push
