name: Temp install react-native-maps

on:
  push:
    branches:
      - feat/local-radar-native-map-20260826

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'Generate react-native-maps lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-radar-native-map-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generate Expo SDK 54 compatible map lockfile
        working-directory: mobile
        run: npm install react-native-maps@1.20.1 --save-exact --package-lock-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Generate react-native-maps lockfile"
          git push origin HEAD:feat/local-radar-native-map-20260826