name: Sync mobile lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/sync-mobile-lock.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/mobile-companion-rescue'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rescue branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-companion-rescue

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "mobile/package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Sync mobile lockfile for Expo GL"
          git push origin HEAD:agent/mobile-companion-rescue
