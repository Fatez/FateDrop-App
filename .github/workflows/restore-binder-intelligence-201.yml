name: Restore Binder intelligence on PR 201

on:
  push:
    branches:
      - feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
    paths:
      - mobile/scripts/restore-binder-intelligence-201.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
          fetch-depth: 0
      - name: Apply guarded source edits
        run: node mobile/scripts/restore-binder-intelligence-201.mjs
      - name: Remove one-shot machinery
        run: rm mobile/scripts/restore-binder-intelligence-201.mjs .github/workflows/restore-binder-intelligence-201.yml
      - name: Commit integrated source
        run: |
          git config user.name "Fatez"
          git config user.email "cdotkeeley@gmail.com"
          git add mobile/screens/fate-binder-screen-v2.tsx mobile/services/fate-collector.ts mobile/scripts/restore-binder-intelligence-201.mjs .github/workflows/restore-binder-intelligence-201.yml
          git commit -m "Restore Binder artwork and finish cost breakdown"
          git push origin HEAD:feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
