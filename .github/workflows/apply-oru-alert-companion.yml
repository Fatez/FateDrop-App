name: Apply Oru & Friends Alerts companion migration

on:
  push:
    branches:
      - agent/koru-friends-3d-integration-2026-08-22
    paths:
      - mobile/scripts/patch-oru-alert-companion.mjs

permissions:
  contents: write

jobs:
  patch-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/koru-friends-3d-integration-2026-08-22
      - name: Apply deterministic Alerts patch
        run: node mobile/scripts/patch-oru-alert-companion.mjs
      - name: Commit generated Alerts patch
        shell: bash
        run: |
          if git diff --quiet -- mobile/screens/alerts-screen-v2.tsx; then
            echo "Alerts already use Oru & Friends."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/screens/alerts-screen-v2.tsx
          git commit -m "Migrate Alerts companion picker to Oru & Friends"
          git push
