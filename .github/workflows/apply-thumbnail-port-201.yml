name: Apply thumbnail port to PR 201

on:
  push:
    branches:
      - feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
    paths:
      - mobile/scripts/apply-thumbnail-port-201.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
          fetch-depth: 0
      - name: Apply guarded source edits
        run: |
          node mobile/scripts/apply-thumbnail-port-201.mjs
          git diff --check
      - name: Remove one-shot machinery
        run: |
          rm mobile/scripts/apply-thumbnail-port-201.mjs
          rm .github/workflows/apply-thumbnail-port-201.yml
      - name: Commit integrated source
        run: |
          git config user.name "FateDrop thumbnail port"
          git config user.email "actions@users.noreply.github.com"
          git add mobile .github/workflows/apply-thumbnail-port-201.yml || true
          git add -u
          git commit -m "Port canonical thumbnails onto simplified FatePulse baseline"
          git push origin HEAD:feat/fatemarket-simple-pulse-binder-bulk-2026-09-07
