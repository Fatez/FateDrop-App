name: Install SecureStore dependency

on:
  push:
    branches: [launch-foundation-v1]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout launch branch
        uses: actions/checkout@v4
        with:
          ref: launch-foundation-v1
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo SecureStore with SDK-compatible version
        working-directory: mobile
        env:
          CI: "1"
        run: npx expo install expo-secure-store --npm
      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo "SecureStore dependency already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "Install Expo SecureStore for mobile session vault"
          git push origin HEAD:launch-foundation-v1
