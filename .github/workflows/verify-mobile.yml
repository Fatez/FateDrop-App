name: Verify FateDrop Mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'server/**'
      - 'monitor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/verify-mobile.yml'
      - 'docs/mobile-security-exceptions.md'
  push:
    branches:
      - fatedrop-mobile-product-spec-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Report mobile production dependency advisories
        working-directory: mobile
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and typecheck mobile
        working-directory: mobile
        run: npm run verify

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx --yes expo-doctor

      - name: Export iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ci-ios

      - name: Export Android bundle
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist-ci-android
