name: Apply canonical thumbnail pilot

on:
  push:
    branches:
      - feat/fatepulse-canonical-thumbnails-pilot-2026-09-07

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[thumbnail-pilot-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fatepulse-canonical-thumbnails-pilot-2026-09-07
          fetch-depth: 0
      - name: Apply exact source edits
        run: node mobile/scripts/apply-canonical-thumbnail-pilot.mjs
      - name: Remove one-shot machinery
        run: rm mobile/scripts/apply-canonical-thumbnail-pilot.mjs .github/workflows/apply-canonical-thumbnail-pilot.yml
      - name: Commit integrated source
        run: |
          git config user.name "FateDrop thumbnail pilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate canonical thumbnails across market and collections [thumbnail-pilot-applied]"
          git push origin HEAD:feat/fatepulse-canonical-thumbnails-pilot-2026-09-07
