name: Apply Oru mobile asset host

on:
  push:
    branches:
      - agent/koru-friends-3d-integration-2026-08-22
    paths:
      - mobile/scripts/patch-oru-asset-host.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/koru-friends-3d-integration-2026-08-22
      - name: Apply canonical web asset host
        run: node mobile/scripts/patch-oru-asset-host.mjs
      - name: Commit generated renderer patch
        shell: bash
        run: |
          if git diff --quiet -- mobile/components/companion-stage.tsx; then
            echo "Renderer already follows the canonical web asset host."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/components/companion-stage.tsx
          git commit -m "Point Oru & Friends mobile renderer at FateDrop web assets"
          git push
