name: Refresh mobile lockfile

on:
  push:
    branches:
      - mobile-audit-overrides-v1
    paths:
      - 'mobile/package.json'
      - '.github/workflows/mobile-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile-audit-overrides-v1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh mobile package lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Refresh mobile lockfile for audit overrides"
          git push origin HEAD:mobile-audit-overrides-v1
